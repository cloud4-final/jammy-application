[project]
name = "instruction-api"
version = "0.1.0"
requires-python = "==3.14.*"
dependencies = [
    "fastapi==0.141.1",
    "jammy-common==0.1.0",
    "pydantic==2.13.5",
    "psycopg[binary]==3.3.9",
    "psycopg-pool==3.3.3",
    "uvicorn==0.52.4",
]

[dependency-groups]
dev = ["httpx==0.28.1", "pytest==9.1.1", "ruff==0.16.10", "testcontainers==4.14.2"]

[tool.uv.sources]
jammy-common = { workspace = true }

[build-system]
requires = ["uv_build==0.12.24"]
build-backend = "uv_build"

[tool.uv.build-backend]
namespace = true
