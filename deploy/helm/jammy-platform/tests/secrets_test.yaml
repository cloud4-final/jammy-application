suite: workload secret configuration
templates:
  - deployment-ingest.yaml
values:
  - ../values-split.yaml
  - site-values.yaml
tests:
  - it: rejects inline NATS credentials
    set:
      ingest.env.NATS_CREDS: fixture-credentials
    asserts:
      - failedTemplate:
          errorMessage: ingest.env.NATS_CREDS must be supplied through a Secret
  - it: mounts NATS credentials from the configured Secret
    set:
      global.nats.existingSecret: nats-auth
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: nats
            secret:
              secretName: nats-auth
              items: [{key: NATS_CREDS, path: credentials}]
