[project]
name = "jammy-e2e"
version = "0.1.0"
requires-python = "==3.14.*"
dependencies = [
    "boto3==1.43.127",
    "httpx==0.28.1",
    "nats-py==2.13.1",
    "protobuf==7.36.2",
    "psycopg==3.3.9",
    "psycopg-binary==3.3.9",
    "pyarrow==25.0.1",
    "pytest==9.1.1",
    "zstandard==0.25.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["."]
markers = [
    "split_only: test only runs on ARM=split (jetstream)",
    "mvp_only: test only runs on ARM=mvp (direct-db)",
    "control: control-plane scenario",
]

[tool.ruff]
extend-exclude = ["pb"]
