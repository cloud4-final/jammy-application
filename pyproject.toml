[project]
name = "jammy-platform"
version = "0.1.0"
requires-python = "==3.14.*"

[tool.uv]
required-version = ">=0.12.24,<0.13"

[tool.uv.workspace]
members = [
    "libs/py",
    "apps/instruction-api",
    "apps/dispatcher",
    "apps/portal-publisher",
    "apps/ingest-py",
    "apps/processor-py",
    "apps/archiver-py",
    "tests/e2e",
]

[dependency-groups]
dev = [
    "jammy-common",
    "httpx==0.28.1",
    "pytest==9.1.1",
    "ruff==0.16.10",
    "zstandard==0.25.0",
]

[tool.uv.sources]
jammy-common = { workspace = true }
